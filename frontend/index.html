<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roxstar AI Voice Room</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎙️ Roxstar AI Voice Room</h1>

        <div id="join-section">
            <input id="room-name" type="text" placeholder="Room name" value="roxstar-demo">
            <input id="participant-name" type="text" placeholder="Your name">
            <button id="join-button">Join Room</button>
        </div>

        <div id="room-section" style="display: none;">
            <div id="connection-status" class="status disconnected">Disconnected</div>
            <div id="error-message" class="error-message"></div>

            <h2>Participants</h2>
            <div id="participants"></div>

            <div class="controls">
                <button id="mic-button">🎤 Mute</button>
                <button id="leave-button">Leave Room</button>
            </div>

            <div class="handoff-controls">
                <button id="dost-button">Talk to Dost</button>
                <button id="sathi-button">Talk to Sathi</button>
            </div>

            <h2>Chat</h2>
            <div id="messages"></div>

            <div class="chat-input">
                <input id="message-input" type="text" placeholder="Type a message...">
                <button id="send-button">Send</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
